name: Validar e empacotar Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilar observador e aplicativo de teste Windows
        shell: pwsh
        run: |
          npm run build:native -- --fixtures 2>&1 | Tee-Object native-build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content native-build.log -Tail 30) -join "%0A")
            Write-Output "::error title=Compilacao nativa::$tail"
            exit 1
          }
      - name: Validar cliques reais e UI Automation
        shell: pwsh
        run: |
          npm run test:native 2>&1 | Tee-Object native-test.log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content native-test.log -Tail 30) -join "%0A")
            Write-Output "::error title=Teste nativo::$tail"
            exit 1
          }
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run test:desktop
      - run: npm run dist:win
      - name: Conferir versão da publicação
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'A tag precisa corresponder à versão do aplicativo.' }
      - name: Preparar arquivos para download
        shell: pwsh
        run: |
          Copy-Item docs/PRIMEIRO-USO.md release/PRIMEIRO-USO.md
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Playbook-Studio-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/PRIMEIRO-USO.md
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Playbook-Studio-Windows-x64
          path: artifacts
      - name: Publicar versão de avaliação
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.exe artifacts/SHA256SUMS.txt artifacts/PRIMEIRO-USO.md --verify-tag --prerelease --title "Playbook Studio $RELEASE_TAG — versão de avaliação" --notes-file .github/RELEASE_NOTES.md
